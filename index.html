<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Title -->
    <title>Provider Phone Number Lookup | Find NPI by Phone Number Database</title>

    <!-- SEO Meta Description -->
    <meta name="description"
        content="Lookup healthcare providers by phone number. Find NPI numbers, provider names, clinics, and contact details instantly using our free provider phone number search database.">

    <!-- Keywords -->
    <meta name="keywords"
        content="phone number NPI lookup, provider phone number lookup, find NPI by phone number, healthcare phone lookup, doctor phone number search, clinic phone number lookup, NPI registry phone search">

    <!-- Robots -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large">

    <!-- Canonical -->
    <link rel="canonical" href="https://lylanoble.github.io/phone_lookup">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Provider Phone Number Lookup | Find NPI by Phone">
    <meta property="og:description"
        content="Search providers using phone numbers. Instantly find NPI numbers, provider names, and healthcare contact information.">
    <meta property="og:url" content="https://lylanoble.github.io/phone_lookup">
    <meta property="og:image" content="https://lylanoble.github.io/phone_lookup/images/phone-npi-lookup.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Phone Number to NPI Lookup Database">
    <meta name="twitter:description"
        content="Find healthcare providers and NPI numbers using phone number search. Fast and free lookup tool.">
    <meta name="twitter:image" content="https://lylanoble.github.io/phone_lookup/images/phone-npi-lookup.jpg">

    <!-- Schema Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Provider Phone Number Lookup",
        "url": "https://lylanoble.github.io/phone_lookup",
        "potentialAction": {
        "@type": "SearchAction",
        "target": "https://lylanoble.github.io/phone_lookup/search?phone={search_term_string}",
        "query-input": "required name=search_term_string"
        }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.png" type="image/png">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen text-slate-200 p-4 md:p-16">

    <div class="mx-auto">
        <!-- Header Card -->
        <div class="group relative mb-8 transition-all duration-500 z-50">
            <div
                class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-cyan-500 rounded-3xl blur opacity-10 group-hover:opacity-25 transition duration-700">
            </div>

            <div class="glass-effect gradient-border relative bg-slate-900/60 p-6 md:p-8 rounded-3xl overflow-visible"
                style="background: var(--bg-secondary);">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <span
                            class="flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 animate-pulse-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </span>
                        <h1 class="text-2xl md:text-3xl font-black tracking-tight" style="color: var(--text-primary);">
                            CrediGo. Provider Database
                        </h1>
                    </div>

                    <!-- Theme Toggle -->
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-semibold uppercase tracking-wide"
                            style="color: var(--text-tertiary);">Theme</span>
                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                            <div class="theme-toggle-slider">
                                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                                </svg>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 relative z-10">
                    <!-- Search Input -->
                    <div class="md:col-span-8">
                        <label class="block text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">Global
                            Phone / NPI Search</label>
                        <div class="relative group">
                            <input type="text" id="phoneInput" placeholder="Enter NPI or Phone"
                                class="w-full pl-5 pr-32 py-4 rounded-2xl focus:border-indigo-500/50 outline-none transition-all text-base font-medium"
                                style="background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-primary);">
                            <button id="execSearch"
                                class="absolute right-3 top-3 bottom-3 px-5 bg-gradient-to-r from-indigo-500 to-cyan-500 text-white rounded-xl hover:from-indigo-600 hover:to-cyan-600 transition-all shadow-lg shadow-indigo-500/20 font-bold text-sm uppercase tracking-wide">
                                Search
                            </button>
                        </div>
                    </div>

                    <!-- Month Picker -->
                    <div class="md:col-span-4 relative z-20">
                        <label class="block text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">Browse by
                            Month</label>
                        <div class="relative">
                            <button id="monthPickerBtn"
                                class="w-full px-5 py-4 rounded-2xl hover:border-indigo-500/50 outline-none transition-all font-semibold text-left flex items-center justify-between group"
                                style="background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-secondary);">
                                <span id="selectedMonthText" class="flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                    <span class="truncate" style="color: var(--text-tertiary);">Select Month</span>
                                </span>
                                <svg id="monthPickerChevron" xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5 transition-transform" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" style="color: var(--text-tertiary);">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <!-- Month Dropdown -->
                            <div id="monthPickerDropdown"
                                class="hidden absolute top-full left-0 right-0 mt-2 rounded-2xl z-[100] shadow-2xl backdrop-blur-xl"
                                style="background: var(--bg-primary); border: 2px solid var(--border-color);">
                                <div class="p-4">
                                    <!-- Year Navigation Header -->
                                    <div class="flex items-center justify-between mb-4 pb-3"
                                        style="border-bottom: 1px solid var(--border-color);">
                                        <button id="prevYear"
                                            class="p-2 hover:bg-white/10 rounded-lg transition-colors text-indigo-400 hover:text-indigo-300">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                                viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M15 19l-7-7 7-7" />
                                            </svg>
                                        </button>
                                        <h3 id="currentYear" class="font-black text-lg tracking-wide"
                                            style="color: var(--text-primary);">2025</h3>
                                        <button id="nextYear"
                                            class="p-2 hover:bg-white/10 rounded-lg transition-colors text-indigo-400 hover:text-indigo-300">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                                viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M9 5l7 7-7 7" />
                                            </svg>
                                        </button>
                                    </div>
                                    <!-- 12 Months Grid -->
                                    <div id="monthsGrid" class="grid grid-cols-3 gap-2">
                                        <!-- Months will be dynamically generated -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status Bar -->
                <div id="statusBar"
                    class="hidden mt-6 p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 items-center justify-between backdrop-blur-sm">
                    <div class="flex items-center gap-3">
                        <div class="loader w-5 h-5 border-2 rounded-full"
                            style="border-color: var(--border-color); border-top-color: #6366f1;"></div>
                        <span id="statusText" class="text-sm font-bold text-indigo-300">Searching...</span>
                    </div>
                    <button id="stopBtn"
                        class="text-xs font-bold text-red-400 hover:text-red-300 uppercase tracking-tight transition-colors">Stop
                        Search</button>
                </div>

                <!-- Background Cache Progress Bar -->
                <div id="cacheProgressContainer" class="hidden mt-4 px-1">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-indigo-400/60">Caching
                            database in background</span>
                        <span id="cacheProgressText" class="text-[10px] font-bold text-indigo-400/60">0%</span>
                    </div>
                    <div class="w-full rounded-full h-1" style="background: var(--input-bg);">
                        <div id="cacheProgressBar" class="h-1 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500"
                            style="width: 0%;"></div>
                    </div>
                </div>

                <div class="absolute -bottom-6 -right-6 w-32 h-32 bg-indigo-500/10 blur-3xl rounded-full"></div>
            </div>
        </div>

        <!-- Pagination Top -->
        <div id="paginationTop" class="hidden glass-effect p-4 rounded-2xl mb-4 relative z-0"
            style="background: var(--bg-secondary); border: 1px solid var(--border-color);">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="text-sm font-bold" style="color: var(--text-secondary);">
                    Showing <span id="rangeStart" class="text-indigo-400">1</span>-<span id="rangeEnd"
                        class="text-indigo-400">100</span> of <span id="totalResults"
                        style="color: var(--text-primary);">0</span> results
                </div>
                <div class="flex items-center gap-2">
                    <button id="firstBtn"
                        class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                        style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                        </svg>
                        <span class="hidden md:inline">First</span>
                    </button>
                    <button id="prevBtn"
                        class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                        style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        <span class="hidden md:inline">Prev</span>
                    </button>
                    <div class="flex items-center gap-2 px-2 md:px-4">
                        <span class="text-xs md:text-sm font-semibold" style="color: var(--text-tertiary);">Page</span>
                        <span id="currentPageNum" class="text-sm font-black text-indigo-400">1</span>
                        <span class="text-xs md:text-sm font-semibold" style="color: var(--text-tertiary);">/</span>
                        <span id="totalPages" class="text-sm font-black" style="color: var(--text-primary);">1</span>
                    </div>
                    <button id="nextBtn"
                        class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                        style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                        <span class="hidden md:inline">Next</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <button id="lastBtn"
                        class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                        style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                        <span class="hidden md:inline">Last</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-0" id="resultsArea">
            <div class="md:col-span-2 glass-effect p-12 w-100 rounded-3xl border border-dashed text-center"
                style="background: var(--bg-card); border-color: var(--border-color); color: var(--text-tertiary);">
                <div class="animate-float inline-block mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-indigo-500/30" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <p class="text-sm font-medium">Search results will appear here.</p>
            </div>
        </div>

        <!-- Pagination Bottom -->
        <div id="paginationBottom" class="hidden glass-effect p-4 rounded-2xl mt-4 relative z-0"
            style="background: var(--bg-secondary); border: 1px solid var(--border-color);">
            <div class="flex items-center justify-center gap-2">
                <button id="firstBtn2"
                    class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                    style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                    </svg>
                    <span class="hidden md:inline">First</span>
                </button>
                <button id="prevBtn2"
                    class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                    style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span class="hidden md:inline">Prev</span>
                </button>
                <div class="flex items-center gap-2 px-2 md:px-4">
                    <span class="text-xs md:text-sm font-semibold" style="color: var(--text-tertiary);">Page</span>
                    <span id="currentPageNum2" class="text-sm font-black text-indigo-400">1</span>
                    <span class="text-xs md:text-sm font-semibold" style="color: var(--text-tertiary);">/</span>
                    <span id="totalPages2" class="text-sm font-black" style="color: var(--text-primary);">1</span>
                </div>
                <button id="nextBtn2"
                    class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                    style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                    <span class="hidden md:inline">Next</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
                <button id="lastBtn2"
                    class="px-3 md:px-4 py-2 rounded-xl transition-all font-semibold text-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2"
                    style="background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-secondary);">
                    <span class="hidden md:inline">Last</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>




    <script src="app.js"></script>


</body>

</html>
